name: publish

# A version tag (0.3.0, no "v") tests and builds @keygrant/electron, then publishes that build to npm
# through npm's trusted publishing: no npm token is stored anywhere, and the package carries provenance.
# The build job, which installs dependencies, cannot request an identity token; the publish job, which can,
# runs no package code. A version already on npm is skipped.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.out.outputs.publish }}
      dist-tag: ${{ steps.out.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check the tag is the package's version
        run: |
          version=$(node -p "require('./sdk/package.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME is not the version in sdk/package.json ($version)."
            exit 1
          fi
      - name: Check whether npm has it already
        id: out
        run: |
          if [ "$(npm view "@keygrant/electron@$GITHUB_REF_NAME" version 2>/dev/null)" = "$GITHUB_REF_NAME" ]; then
            echo "::notice::@keygrant/electron $GITHUB_REF_NAME is already on npm: nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          # `latest` moves only forwards: a prerelease goes out as `next`, and a version below npm's latest
          # (a fix to an older line) as `previous`.
          latest=$(npm view @keygrant/electron dist-tags.latest 2>/dev/null || true)
          below='const [a, b] = process.argv.slice(1).map((v) => v.split(".").map(Number)); const i = [0, 1, 2].find((n) => a[n] !== b[n]); process.exit(i !== undefined && a[i] < b[i] ? 0 : 1)'
          case "$GITHUB_REF_NAME" in
            *-*) echo "dist-tag=next" >> "$GITHUB_OUTPUT" ;;
            *)
              if [ -n "$latest" ] && node -e "$below" "$GITHUB_REF_NAME" "$latest"; then
                echo "dist-tag=previous" >> "$GITHUB_OUTPUT"
              else
                echo "dist-tag=latest" >> "$GITHUB_OUTPUT"
              fi
              ;;
          esac
      - name: Install
        if: steps.out.outputs.publish == 'true'
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Test
        if: steps.out.outputs.publish == 'true'
        run: |
          pnpm test
          pnpm run typecheck
      - name: Pack and check the package
        if: steps.out.outputs.publish == 'true'
        run: |
          mkdir out
          (cd sdk && pnpm pack --pack-destination ../out)
          node sdk/scripts/check-package.mjs --tarball "out/keygrant-electron-$GITHUB_REF_NAME.tgz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.out.outputs.publish == 'true'
        with:
          name: package
          path: out/keygrant-electron-${{ github.ref_name }}.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Publish to npm
        env:
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
        run: |
          # Trusted publishing needs npm 11.5.1 or later.
          if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"; then
            npm install --global npm@11.21.0
          fi
          npm --version
          # "./": a path npm cannot read as a package name or a GitHub owner/repository.
          npm publish "./keygrant-electron-$GITHUB_REF_NAME.tgz" --access public --tag "$DIST_TAG" --provenance --ignore-scripts
